# Validates that a pull request would build and deploy cleanly, without
# touching the cluster. The deploy itself runs from main.yml on push to
# master, after review.
name: Validate pull request

on:
  pull_request:
    branches:
    - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # Secrets are unavailable to pull requests from forks, so the image
    # build is limited to branches pushed to this repository.
    - name: Decrypt large secret
      if: github.event.pull_request.head.repo.full_name == github.repository
      run: ./docker/performance-dev_php/secrets_enc/decrypt.sh
      env:
        SECRETS_PASSPHRASE: ${{ secrets.SECRETS_PASSPHRASE }}

    # Build only. Nothing is pushed to the registry and no image tagged
    # here can reach the cluster.
    - name: Build php image
      if: github.event.pull_request.head.repo.full_name == github.repository
      run: |
        docker build -f ./docker/performance-dev_php/Dockerfile . \
          -t performance-dev_php:${{ github.sha }}

    - name: Build nginx image
      if: github.event.pull_request.head.repo.full_name == github.repository
      run: |
        docker build -f ./docker/performance-dev_nginx/Dockerfile . \
          -t performance-dev_nginx:${{ github.sha }}

    # Catches malformed manifests without contacting the cluster.
    - name: Validate Kubernetes manifests
      run: |
        for manifest in kubernetes/*.yml; do
          echo "--- $manifest"
          kubectl apply --dry-run=client -f "$manifest"
        done
